    <h3>Difficulty</h3>${segHtml('diff', [['auto', 'Auto'], ['easy', 'Easy'], ['medium', 'Medium'], ['hard', 'Hard'], ['expert', 'Expert']])}<p class="tiny muted">Auto adjusts per level from your recent accuracy. Hard and Expert hide vocabulary hints. Korean conversations ask for your own reply before showing options from Medium up (Japanese from Hard).</p>
    <h3>Timer</h3>${segHtml('timer', [['off', 'Off'], ['gentle', 'Gentle 30s'], ['challenge', 'Challenge 12s']])}
    <h3>Romanisation</h3><div class="row">${segHtml('romKo', [[false, 'Korean: hidden'], [true, 'Korean: show']])}${segHtml('romJa', [[true, 'Japanese: show'], [false, 'Japanese: hidden']])}</div>
    <h3>Display</h3><div class="row">${segHtml('theme', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']])}${segHtml('big', [[false, 'Normal text'], [true, 'Large text']])}${segHtml('motion', [['auto', 'Motion: auto'], ['reduce', 'Reduce motion']])}</div>
    <h3>Audio check</h3>
    <div class="small">${TTS.ok ? 'Speech synthesis is supported.' : 'Speech synthesis is not supported in this browser.'} Only voices installed on this device are used; online voices are ignored so audio works offline.</div>
    <div class="row" style="margin:8px 0">${vk.length ? `<select class="btn small" data-voice="ko">${vk.map(v => `<option ${v.name === (TTS.voice('ko') || {}).name ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>${speakBtn('천천히 말씀해 주세요.', 'ko')}` : '<span class="tag">No Korean voice</span>'}</div>
    <div class="row" style="margin:8px 0">${vj.length ? `<select class="btn small" data-voice="ja">${vj.map(v => `<option ${v.name === (TTS.voice('ja') || {}).name ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>${speakBtn('ゆっくり話してください。', 'ja')}` : '<span class="tag">No Japanese voice</span>'}</div>
    ${segHtml('rate', [[0.8, 'Speech 0.8×'], [0.9, '0.9×'], [1, '1.0×']])}
    <details><summary>How to add voices</summary><p class="small"><b>Mac:</b> System Settings → Accessibility → Spoken Content → System voice → Manage Voices → add Korean (e.g. Yuna) and Japanese (e.g. Kyoko). Restart the browser.<br><b>iPhone:</b> Settings → Accessibility → Spoken Content → Voices → Korean / Japanese → download a voice. Menu names vary slightly by OS version.<br>Download voices before the flight. They need internet to download, but work offline afterwards.</p></details>
    <p class="tiny muted" style="margin-top:12px">Progress: ${storageOK ? 'saved on this device' : 'NOT being saved — export regularly'} · <a href="#help" data-act="closeSheet">Preflight check</a></p>`);
  $$('.sheet [data-set]').forEach(seg => seg.onclick = e => { const b = e.target.closest('button'); if (!b) return; let v = b.dataset.v; if (v === 'true') v = true; else if (v === 'false') v = false; else if (!isNaN(+v) && seg.dataset.set === 'rate') v = +v; S.settings[seg.dataset.set] = v; save(); applySettings(); $$('button', seg).forEach(x => x.classList.toggle('on', x === b)); });
  $$('.sheet [data-voice]').forEach(sel => sel.onchange = () => { S.settings[sel.dataset.voice === 'ko' ? 'voiceKo' : 'voiceJa'] = sel.value; save(); });
}
function applySettings() {
  const r = document.documentElement; const t = S.settings.theme;
  if (t === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);
  r.classList.toggle('big', !!S.settings.big); r.classList.toggle('reduce', S.settings.motion === 'reduce');
}
function openSheet(html) { closeSheet(); const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet'; bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; bg.onclick = e => { if (e.target === bg) closeSheet(); }; document.body.appendChild(bg); const f = $('.sheet button, .sheet input', bg); if (f) f.focus(); }
function closeSheet() { const s = $('#sheet'); if (s) s.remove(); }
function bigCard(lang, text, en) {
  const d = document.createElement('div'); d.className = 'big-card'; d.id = 'bigcard'; d.setAttribute('role', 'dialog');
  d.innerHTML = `<div class="x"><button class="btn" data-act="closeBig">${ICON.x} Close</button></div><div class="t ${lang}">${esc(text)}</div>${en ? `<div class="s">${esc(en)}</div>` : ''}<div class="row" style="margin-top:24px;justify-content:center">${speakBtn(text, lang)}</div>`;
  document.body.appendChild(d);
}
function copyText(t) {
  const done = () => toast('Copied');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => fallback());
  else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy not available here'); } ta.remove(); }
}

/* ---------- actions ---------- */
const ACT = {
  start: a => startKey(a), resume: () => resumeSession(), settings: () => openSettings(), closeSheet: () => closeSheet(),
  runExit: () => { if (RUN) { S.cur = { key: RUN.key, title: RUN.title, lang: RUN.lang, lv: RUN.lv, list: RUN.list, i: RUN.i, res: RUN.res, quest: RUN.quest, brave: RUN.brave }; save(true); } TTS.stop(); clearTimer(); RUN = null; document.body.classList.remove('running'); toast('Paused. Resume from Home.'); location.hash = '#home'; },
  unlock: a => { S.unlocked[+a] = true; save(); route(); },
  questStart: () => { if (!S.quest.started) S.quest.started = now(); S.quest.paused = false; S.quest.last = now(); save(); location.hash = '#quest'; route(); },
  questPause: () => { S.quest.paused = !S.quest.paused; S.quest.last = now(); save(); route(); },
  questSkip: a => { S.quest.skipped[a] = now(); save(); route(); },
  questReset: () => { if (confirm('Reset Flight Quest progress? (Your learning records stay.)')) { S.quest = DEFAULT_STATE().quest; save(); route(); } },
  breakEnd: a => { questComplete(a); clearTimer(); location.hash = '#quest'; },
  bigcard: a => { const [l, t, en] = a.split('|'); bigCard(l, t, en); }, closeBig: () => { const b = $('#bigcard'); if (b) b.remove(); TTS.stop(); },
  phrase: a => phraseSheet(a), copy: a => copyText(a),
  book: a => { S.book = S.book.includes(a) ? S.book.filter(x => x !== a) : [a].concat(S.book); save(); toast(S.book.includes(a) ? 'Saved' : 'Removed'); if ($('#sheet')) phraseSheet(a); else route(); },
  export: () => { const blob = new Blob([exportData()], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `language-academy-backup-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000); toast('Backup file created'); },
  exportCopy: () => { const code = btoa(unescape(encodeURIComponent(JSON.stringify({ state: S })))); copyText(code); openSheet(`<h2>Backup code</h2><p class="small">Copied to the clipboard if allowed. You can also select it below and paste it into Notes or a message to yourself.</p><textarea class="ans" style="font-family:monospace;font-size:.75rem;min-height:160px" readonly>${esc(code)}</textarea><button class="btn wide" data-act="closeSheet">Done</button>`); },
  importPaste: () => { openSheet(`<h2>Paste backup code</h2><textarea class="ans" id="impText" style="font-family:monospace;font-size:.8rem;min-height:160px" placeholder="Paste the code or the JSON here"></textarea><div class="row" style="margin-top:10px"><button class="btn primary" data-act="importDo">Import</button><button class="btn ghost" data-act="closeSheet">Cancel</button></div>`); },
  importDo: () => { const t = $('#impText').value; closeSheet(); doImport(t); },
  reset: () => { if (confirm('Erase ALL progress on this device? Export first if unsure.') && confirm('Really erase everything?')) { S = DEFAULT_STATE(); save(true); applySettings(); route(); toast('Progress reset'); } },
  routeHelp: () => route(),
  conceptSheet: a => { const c = DB.conceptById[a]; if (!c) return; openSheet(`<div class="row between"><div class="ex-type">${esc((DB.lessons.find(l => l.id === c.l) || {}).title || c.l)}</div><button class="iconbtn" data-act="closeSheet" aria-label="Close">${ICON.x}</button></div><h2>${esc(c.t)}</h2><p>${esc(c.ex)}</p><ul>${c.rules.map(r => `<li class="ko">${esc(r)}</li>`).join('')}</ul>${c.eg.map(([k, e]) => `<div class="small"><span class="ko"><b>${esc(k)}</b></span> — ${esc(e)}</div>`).join('')}${c.err.length ? `<p class="small muted" style="margin-top:8px">${c.err.map(esc).join('<br>')}</p>` : ''}`); }
};
function bindGlobal() {
  document.addEventListener('click', e => {
    const say = e.target.closest('[data-say]'); if (say) { e.preventDefault(); TTS.speak(say.dataset.say, say.dataset.lang, !!say.dataset.slow); return; }
    const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); location.hash = go.dataset.go; return; }
    const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) { if (a.tagName === 'A') e.preventDefault(); ACT[a.dataset.act](a.dataset.arg, a); if (a.dataset.act === 'closeSheet' && a.getAttribute('href')) location.hash = a.getAttribute('href'); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if ($('#bigcard')) return ACT.closeBig(); if ($('#sheet')) return closeSheet(); }
    const tag = (e.target.tagName || '').toLowerCase();
    if (location.hash !== '#run' || tag === 'textarea' || tag === 'input' || tag === 'select') return;
    if (e.key === 'Enter') { const p = $('#foot [data-primary]'); if (p && !$('#sheet')) { e.preventDefault(); p.click(); } }
    if (/^[1-9]$/.test(e.key)) { const opts = $$('#ex [data-opt]:not([disabled])'); const b = opts.find(o => o.dataset.opt === String(+e.key - 1)); if (b) { e.preventDefault(); b.click(); } }
  });
  window.addEventListener('hashchange', route);
  setInterval(() => { const q = S.quest; if (q.started && !q.paused && document.visibilityState === 'visible') { const t = now(); const dt = Math.min(60000, t - (q.last || t)); q.active += dt; q.last = t; save(); } else if (q.started) q.last = now(); }, 15000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(true); S.quest.last = now(); });
}

/* ---------- init ---------- */
function init() {
  loadState(); registerContent(); TTS.load(); applySettings(); bindGlobal();
  $('#nav').innerHTML = `<div class="in">${[['#home', 'Home', ICON.home], ['#ko', 'Korean', ICON.ko], ['#ja', 'Japan', ICON.ja], ['#quest', 'Quest', ICON.plane], ['#phrases', 'Phrases', ICON.book], ['#progress', 'Progress', ICON.chart]].map(([h, l, i]) => `<button data-go="${h}">${i}<span>${l}</span></button>`).join('')}</div>`;
  $('#top').innerHTML = `<div class="in"><button class="brand" data-go="#home"><span style="color:var(--sage-d)">●</span> Travel Language Academy</button><button class="iconbtn" data-act="settings" aria-label="Settings">${ICON.gear}</button></div>`;
  if (location.hash === '#run' && !S.cur) location.hash = '#home';
  route();
  setTimeout(() => { if (location.hash !== '#run' && /^#(listen|ja|jpron|help)?$/.test(location.hash.split('/')[0])) route(); }, 1200); // voices often load late
  window.__APP_READY__ = true;
}
document.addEventListener('DOMContentLoaded', init);

</script>
<script>if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e)));}</script>
</body>
