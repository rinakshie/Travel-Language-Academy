<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5EF">
<meta name="color-scheme" content="light dark">

<title>Travel Language Academy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<style>:root{
  --bg:#F7F5EF; --card:#FFFEFB; --card2:#F1EEE6; --ink:#303638; --muted:#5F676A; --line:#E3DED3;
  --sage:#A8B8A5; --sage-d:#4F6B4B; --sage-t:#E7EDE5;
  --blue:#A9BFCE; --blue-d:#3F6178; --blue-t:#E5EDF2;
  --lav:#C5BED6; --lav-d:#5E5482; --lav-t:#ECE9F2;
  --peach:#E8C3AD; --peach-d:#8E553B; --peach-t:#F7EAE2;
  --ok:#4C7A48; --ok-t:#E3EEDF; --warn:#946320; --warn-t:#F6ECDB; --err:#9C4A3D; --err-t:#F5E3DF;
  --shadow:0 1px 2px rgba(48,54,56,.06),0 4px 14px rgba(48,54,56,.06);
  --r:16px; --r-s:11px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --ko:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Nanum Gothic",-apple-system,sans-serif;
  --ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",-apple-system,sans-serif;
  --fs:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C2022; --card:#252A2C; --card2:#2C3235; --ink:#ECEAE4; --muted:#A9B0B2; --line:#383F42;
  --sage-d:#A9C2A4; --sage-t:#2B352A; --blue-d:#A9C3D6; --blue-t:#25313A; --lav-d:#C5BDE0; --lav-t:#2F2C3A; --peach-d:#E8B89C; --peach-t:#3A2E28;
  --ok:#9CC795; --ok-t:#26331F; --warn:#E3B36E; --warn-t:#3A3020; --err:#E59A8C; --err-t:#3B2723; --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#1C2022; --card:#252A2C; --card2:#2C3235; --ink:#ECEAE4; --muted:#A9B0B2; --line:#383F42;
  --sage-d:#A9C2A4; --sage-t:#2B352A; --blue-d:#A9C3D6; --blue-t:#25313A; --lav-d:#C5BDE0; --lav-t:#2F2C3A; --peach-d:#E8B89C; --peach-t:#3A2E28;
  --ok:#9CC795; --ok-t:#26331F; --warn:#E3B36E; --warn-t:#3A3020; --err:#E59A8C; --err-t:#3B2723; --shadow:0 1px 2px rgba(0,0,0,.3);
}
:root.big{--fs:18.5px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue-d)}
:focus-visible{outline:3px solid var(--blue-d);outline-offset:2px;border-radius:6px}
.ko{font-family:var(--ko);word-break:keep-all;overflow-wrap:anywhere}
.ja{font-family:var(--ja);overflow-wrap:anywhere;line-break:strict}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 110px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.005em;line-height:1.25;margin:0 0 .4em}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:.3em 0 .7em}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.78rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.tap{cursor:pointer;text-align:left;width:100%;display:block;transition:transform .15s,border-color .15s}
.card.tap:hover{border-color:var(--sage)}
.card.tap:active{transform:scale(.99)}
.sect{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sect h2{margin:0}
.btn{min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--sage)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sage{background:var(--sage-d);border-color:var(--sage-d);color:#fff}
:root[data-theme="dark"] .btn.sage{color:#1C2022}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.sage{color:#1C2022}}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.84rem}
button.chip{min-height:40px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted)}
.tag.ko{background:var(--blue-t);color:var(--blue-d);font-family:var(--sans)} .tag.ja{background:var(--peach-t);color:var(--peach-d);font-family:var(--sans)}
.tag.sage{background:var(--sage-t);color:var(--sage-d)} .tag.lav{background:var(--lav-t);color:var(--lav-d)}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sage-d);border-radius:99px;transition:width .4s}
.bar.blue>i{background:var(--blue-d)} .bar.peach>i{background:var(--peach-d)} .bar.lav>i{background:var(--lav-d)}
/* top bar & nav */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px}
.brand{font-family:var(--serif);font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;min-height:44px}
.iconbtn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{border-color:var(--line)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{background:none;border:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;color:var(--muted);padding:4px 0}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--ink);font-weight:700}
.nav button.on svg{stroke:var(--sage-d)}
/* hero */
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .art{position:absolute;right:-6px;top:-6px;width:170px;opacity:.9;pointer-events:none}
.hero h1{max-width:72%}
.hero .next{margin-top:14px;padding:14px;border-radius:14px;background:var(--sage-t);border:1px solid color-mix(in srgb,var(--sage) 60%,transparent)}
.hero .next .lab{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sage-d)}
@media (max-width:480px){.hero .art{width:120px;opacity:.55}.hero h1{max-width:100%}}
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font-size:1.25rem;font-family:var(--serif)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-height:56px;width:100%;text-align:left}
button.li:hover{border-color:var(--sage)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.done{background:var(--sage-d)} .dot.skip{background:var(--peach)} .dot.now{background:var(--blue-d);box-shadow:0 0 0 4px var(--blue-t)}
.lock{opacity:.6}
/* runner */
.run{min-height:100vh;display:flex;flex-direction:column}
.run .head{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.run .head .in{max-width:760px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:10px;min-height:56px}
.run .head .bar{flex:1}
.run main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:18px 16px 140px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.foot .in{max-width:760px;margin:0 auto;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.foot .in .btn{flex:1 1 140px}
.ex-type{font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prompt{font-size:1.18rem;font-weight:600;margin:4px 0 12px}
.big-ko{font-family:var(--ko);font-size:1.55rem;font-weight:600;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.big-ja{font-family:var(--ja);font-size:1.5rem;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.rom{color:var(--muted);font-size:.92rem;font-style:italic}
.situ{background:var(--card2);border-radius:var(--r-s);padding:12px 14px;margin:8px 0 12px}
.hint{border-left:3px solid var(--lav);background:var(--lav-t);border-radius:0 10px 10px 0;padding:8px 12px;margin:8px 0;font-size:.92rem}
.frame{font-family:var(--ko);background:var(--blue-t);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:1.05rem}
textarea.ans,input.ans{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:12px 14px;font-size:1.12rem;font-family:var(--ko)}
textarea.ans{min-height:84px;resize:vertical}
textarea.ans:focus,input.ans:focus{outline:none;border-color:var(--blue-d)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{text-align:left;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:var(--blue)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--card2);font-size:.75rem;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);margin-top:2px}
.opt.right{border-color:var(--ok);background:var(--ok-t)} .opt.wrong{border-color:var(--err);background:var(--err-t)} .opt.mid{border-color:var(--warn);background:var(--warn-t)}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:14px;margin-top:14px;border:1px solid var(--line);background:var(--card)}
.fb.ok{background:var(--ok-t);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.fb.warn{background:var(--warn-t);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.fb.err{background:var(--err-t);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.fb.info{background:var(--blue-t);border-color:color-mix(in srgb,var(--blue-d) 30%,transparent)}
.fb .h{font-weight:700;margin-bottom:4px}
.model{font-family:var(--ko);font-size:1.15rem;font-weight:600;margin:4px 0}
.alts{margin:6px 0 0;padding-left:18px}
.alts li{font-family:var(--ko)}
del{background:color-mix(in srgb,var(--err) 22%,transparent);text-decoration:line-through;border-radius:3px}
ins{background:color-mix(in srgb,var(--ok) 25%,transparent);text-decoration:none;border-radius:3px}
.selfrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.selfrow .btn{padding:8px 6px;font-size:.88rem;flex-direction:column;gap:2px;min-height:58px}
.conf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.conf button{min-width:44px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.conf button.on{background:var(--lav-d);color:#fff;border-color:var(--lav-d)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--lav-d);font-size:.95rem}
.bubble{border-radius:16px;padding:12px 14px;margin:8px 0;max-width:92%}
.bubble.npc{background:var(--card2);border-top-left-radius:4px}
.bubble.me{background:var(--blue-t);margin-left:auto;border-top-right-radius:4px}
.play{display:inline-flex;align-items:center;gap:6px}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tok{min-height:44px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-family:var(--ko);font-size:1.05rem}
.tok.used{opacity:.25}
.tokline{min-height:60px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match button{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:8px;font-size:1rem}
.match button.sel{border-color:var(--blue-d);background:var(--blue-t)}
.match button.ok{opacity:.35;border-color:var(--ok)}
.match button.bad{border-color:var(--err);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.checks{list-style:none;padding:0;margin:6px 0}
.checks li{display:flex;gap:8px;align-items:center;padding:3px 0}
.flash{min-height:90px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--card2);padding:14px;text-align:center}
.notice{border-radius:12px;padding:10px 12px;background:var(--warn-t);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:.88rem;margin:8px 0}
.notice.blue{background:var(--blue-t);border-color:color-mix(in srgb,var(--blue-d) 30%,transparent)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,24,26,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:800px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
.big-card{position:fixed;inset:0;z-index:60;background:#FFFFFF;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));text-align:center}
.big-card .t{font-size:clamp(2rem,9vw,4.2rem);font-weight:700;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.big-card .s{font-size:1.1rem;color:#444;margin-top:18px}
.big-card .x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px}
.big-card .x .btn{background:#fff;color:#111;border-color:#ccc}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);min-height:40px;padding:6px 12px;font-size:.88rem}
.seg button.on{background:var(--ink);color:var(--bg)}
.search{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 14px;font-size:1rem}
.phr{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;width:100%;min-height:56px}
.phr .main{flex:1;min-width:0}
.phr .tl{font-size:1.12rem;font-weight:600}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x>*{flex:none}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tablewrap{overflow-x:auto}
.stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;border:2px dashed var(--lav-d);color:var(--lav-d);font-size:.66rem;font-weight:700;text-align:center;padding:8px;transform:rotate(-6deg);line-height:1.15}
.stamp.off{border-color:var(--line);color:var(--muted);opacity:.6;transform:none}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
details{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px 14px;margin:8px 0}
details summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.reduce *,.reduce *::before,.reduce *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.pill-ok{color:var(--ok);font-weight:700} .pill-err{color:var(--err);font-weight:700} .pill-warn{color:var(--warn);font-weight:700}
kbd{font-family:inherit;font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 5px;background:var(--card)}
</style>

<body>
<header class="top" id="top"></header>
<div id="app"><noscript><p style="padding:20px">This app needs JavaScript. If you opened it in a file preview (e.g. iOS Files), open it in a browser instead.</p></noscript></div>
<nav class="nav" id="nav" aria-label="Main"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>/* build c5250cef */
/* ---- core.js ---- */
/* =========================================================
   Travel Language Academy — core: data registry, state,
   spaced retrieval, answer evaluation, speech, numbers.
   Everything here runs offline. No network calls anywhere.
   ========================================================= */
'use strict';

/* ---------- tiny utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const now = () => Date.now();
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const uniq = a => Array.from(new Set(a));

/* ---------- content registry ---------- */
const DB = {
  concepts: [], conceptById: {}, items: {}, pools: {}, vocab: [],
  lessons: [], ko: { sp: [], rc: [], rs: [], li: [], ip: [], cv: [], bb: [], dl: [], mp: [], phrases: [] },
  ja: { modules: [], phrases: [], replies: [], cv: [], days: [], pron: [], mp: [] }
};
function addItem(pool, it) {
  if (DB.items[it.id]) { console.warn('duplicate id', it.id); return it; }
  it.pool = pool; DB.items[it.id] = it; (DB.pools[pool] = DB.pools[pool] || []).push(it); return it;
}
const SEQ = {};
function nextId(p, c) { const k = p + ':' + c; SEQ[k] = SEQ[k] || 0; return k + ':' + (SEQ[k]++); }
function lines(s) { return s.split('\n').map(x => x.trim()).filter(x => x && !x.startsWith('//')); }
function cut(s, sep) { const i = s.indexOf(sep); return i < 0 ? [s, ''] : [s.slice(0, i), s.slice(i + sep.length)]; }
function alts(s) { return s.split('|').map(x => x.trim()).filter(Boolean); }

function CONCEPT(o) { o.lesson = o.l; DB.concepts.push(o); DB.conceptById[o.id] = o; }
/* Translation / production: "English prompt = 모범 답안 | 대안" */
function TR(src, c, text) { lines(text).forEach((l, i) => { const [en, ko] = cut(l, '='); addItem('tr', { id: nextId('tr', c), src, c, en: en.trim(), acc: alts(ko) }); }); }
/* Open personal question: "질문 = example answer | alt ~ English gloss" */
function QA(src, c, text) { lines(text).forEach((l, i) => { const k = l.lastIndexOf(' ~ '); const [a, gl] = k < 0 ? [l, ''] : [l.slice(0, k), l.slice(k + 3)]; const [q, m] = cut(a, '='); addItem('qa', { id: nextId('qa', c), src, c, q: q.trim(), acc: alts(m), gloss: gl.trim() }); }); }
/* Conjugation / form drill: "base > form label = answer | alt" */
function CJ(src, c, text) { lines(text).forEach((l, i) => { const [a, ans] = cut(l, '='); const [base, lab] = cut(a, '>'); addItem('cj', { id: nextId('cj', c), src, c, base: base.trim(), label: lab.trim(), acc: alts(ans) }); }); }
/* Fill the blank: "sentence with ___ = answer | alt # gloss" */
function FB(src, c, text) { lines(text).forEach((l, i) => { const [a, gl] = cut(l, '#'); const [s, ans] = cut(a, '='); addItem('fb', { id: nextId('fb', c), src, c, s: s.trim(), acc: alts(ans), gloss: gl.trim() }); }); }
/* Find the mistake: "wrong => right | alt # why" */
function MK(src, c, text) { lines(text).forEach((l, i) => { const [a, why] = cut(l, '#'); const [w, r] = cut(a, '=>'); addItem('mk', { id: nextId('mk', c), src, c, wrong: w.trim(), acc: alts(r), why: why.trim() }); }); }
/* Most natural: "context # opt* | opt | opt # why" */
function NC(src, c, text) { lines(text).forEach((l, i) => { const p = l.split('#'); const opts = alts(p[1]); const ans = opts.findIndex(o => o.endsWith('*')); addItem('nc', { id: nextId('nc', c), src, c, ctx: p[0].trim(), opts: opts.map(o => o.replace(/\*$/, '').trim()), ans, why: (p[2] || '').trim() }); }); }
/* Politeness switch: "plain sentence > subject cue = honorific answer | alt" */
function PS(src, c, text) { lines(text).forEach((l, i) => { const [a, ans] = cut(l, '='); const [plain, cue] = cut(a, '>'); addItem('ps', { id: nextId('ps', c), src, c, plain: plain.trim(), cue: cue.trim(), acc: alts(ans) }); }); }
/* Vocabulary: "한국어|alt = English = category" */
function V(src, text) { lines(text).forEach(l => { const p = l.split('=').map(x => x.trim()); const ko = alts(p[0]); const id = `v:${ko[0]}`; if (DB.items[id]) return; const it = addItem('v', { id, src, ko: ko[0], acc: ko, en: p[1], cat: p[2] || 'general', travel: /travel|food|transport|hotel|shop|direction|place|number|help/.test(p[2] || '') }); DB.vocab.push(it); }); }

/* ---------- persistent state ---------- */
const STORE_KEY = 'tla.progress.v1';
const DEFAULT_STATE = () => ({
  v: 1, created: now(),
  settings: { mode: 'standard', diff: 'auto', romKo: false, romJa: true, theme: 'auto', timer: 'off', rate: 0.9, big: false, motion: 'auto', voiceKo: '', voiceJa: '' },
  items: {},          // id -> {a,c,box,due,last,hist,self,hint}
  skills: {},         // skill -> {a,c,self,selfOk}
  conf: [],           // confidence ratings
  book: [],           // bookmarked phrase ids
  recent: [],         // recently viewed phrase ids
  hist: [],           // session history
  cur: null,          // resumable session
  quest: { started: 0, active: 0, paused: true, done: {}, skipped: {}, last: 0 },
  unlocked: { 1: true },
  done: {},           // completed activity keys -> count
  seen: {}
});
let S = DEFAULT_STATE();
let storageOK = true;
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const d = JSON.parse(raw); S = mergeState(DEFAULT_STATE(), d); }
    localStorage.setItem('tla.probe', '1'); localStorage.removeItem('tla.probe');
  } catch (e) { storageOK = false; console.warn('storage unavailable', e); }
}
function mergeState(base, d) {
  if (!d || typeof d !== 'object') return base;
  for (const k of Object.keys(base)) {
    if (d[k] === undefined) continue;
    if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k]) && d[k] && typeof d[k] === 'object' && !Array.isArray(d[k])) base[k] = Object.assign(base[k], d[k]);
    else base[k] = d[k];
  }
  return base;
}
let saveTimer = null;
function save(immediate) {
  if (!storageOK) return;
  clearTimeout(saveTimer);
  const go = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { storageOK = false; toast('Progress could not be saved on this device. Use Export to back up.'); } };
  if (immediate) go(); else saveTimer = setTimeout(go, 250);
}

/* ---------- spaced retrieval (transparent Leitner) ----------
   Boxes 0–5. Interval after a success: 0:now 1:3 min 2:15 min 3:2 h 4:1 day 5:3 days.
   A miss drops the item to box 1 and schedules it again within the session.
   Recognition (multiple choice) can lift an item to box 2 at most:
   only typed recall / production can reach "mastered" (box 4+).        */
const INTERVALS = [0, 3, 15, 120, 1440, 4320].map(m => m * 60000);
const PRODUCTION_KINDS = new Set(['recall', 'produce', 'construct', 'grammar', 'interp']);
function itemRec(id) { return S.items[id] || (S.items[id] = { a: 0, c: 0, box: 0, due: 0, last: 0, hist: '', self: 0, hint: 0 }); }
/* result: {score 0..1, self:boolean, kind:'recog'|'recall'|..., hint:boolean} */
function recordItem(id, r) {
  const it = itemRec(id); it.a++; it.last = now();
  const good = r.score >= 0.75; const part = r.score >= 0.4;
  if (good) it.c++;
  if (r.self) it.self++;
  if (r.hint) it.hint++;
  it.hist = (it.hist + (good ? (r.self ? 's' : 'y') : part ? 'p' : 'n')).slice(-6);
  const cap = (r.kind === 'recog' || r.kind === 'read') ? 2 : (r.self ? 3 : 5);
  if (good) it.box = Math.min(cap, Math.max(it.box, 0) + (r.hint ? 0 : 1));
  else if (part) it.box = Math.max(1, it.box - 1);
  else it.box = 1;
  it.due = now() + INTERVALS[clamp(it.box, 0, 5)];
  it.kind = r.kind;
  const sk = S.skills[r.kind] || (S.skills[r.kind] = { a: 0, c: 0, self: 0, selfOk: 0 });
  if (r.self) { sk.self++; if (good) sk.selfOk++; } else { sk.a++; if (good) sk.c++; }
  save();
}
function isDue(id) { const it = S.items[id]; return it && it.a > 0 && it.due <= now(); }
function weakness(id) {
  const it = S.items[id]; if (!it || !it.a) return 0;
  const misses = (it.hist.match(/n/g) || []).length + 0.5 * (it.hist.match(/p/g) || []).length;
  return misses + (it.box <= 1 ? 1 : 0);
}
function priority(item) {
  const it = S.items[item.id];
  let p = Math.random() * 1.5;
  if (!it || !it.a) p += 2;                       // unseen
  else { if (it.due <= now()) p += 3; p += weakness(item.id) * 1.5; p -= it.box * 0.6; }
  if (item.travel || item.t) p += 0.5;            // high-value travel content
  return p;
}

/* ---------- Korean normalisation and evaluation ---------- */
const KO_CANON = [
  ['휴대전화', '핸드폰'], ['휴대폰', '핸드폰'], ['스마트폰', '핸드폰'], ['티비', '텔레비전'], ['tv', '텔레비전'],
  ['얘기', '이야기'], ['여기서', '여기에서'], ['거기서', '거기에서'], ['저기서', '저기에서'], ['에게', '한테'],
  ['야해', '야돼'], ['야했', '야됐'], ['죠', '지요'], ['거예요', '것이에요'], ['것을', '걸'], ['것은', '건'], ['것이', '게'],
  ['엄마', '어머니'], ['아빠', '아버지'], ['알레르기', '알러지'], ['달걀', '계란'], ['초록색', '녹색'], ['정도', '쯤'],
  ['그렇지만', '하지만'], ['그런데', '근데'], ['조금', '좀'], ['아주', '정말'], ['너무', '정말'], ['많이', '많이']
];
function normBase(s) {
  return String(s || '').normalize('NFC').toLowerCase()
    .replace(/[\s.,!?~'"“”‘’…·、。！？「」()（）:;\-–—]/g, '');
}
function canonKo(s) {
  let t = normBase(s);
  for (const [a, b] of KO_CANON) t = t.split(a).join(b);
  t = t.replace(/^(저는|제가|나는|내가|우리는)/, '');
  return t;
}
function canonJa(s) { return normBase(s).replace(/[、。]/g, ''); }
function lev(a, b) {
  if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) { cur[0] = i; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); [prev, cur] = [cur, prev]; }
  return prev[n];
}
/* Returns {status:'match'|'near'|'unknown'|'empty', best, sim} — never claims a sentence is wrong
   just because it is not in the answer bank. */
function evaluate(input, accepted, lang) {
  const canon = lang === 'ja' ? canonJa : canonKo;
  const u = canon(input);
  if (!u) return { status: 'empty' };
  let best = accepted[0], bestSim = -1;
  for (const a of accepted) {
    const c = canon(a);
    if (c === u) return { status: 'match', best: a, sim: 1 };
    const sim = 1 - lev(u, c) / Math.max(u.length, c.length);
    if (sim > bestSim) { bestSim = sim; best = a; }
  }
  if (bestSim >= 0.8 && u.length >= 3) return { status: 'near', best, sim: bestSim };
  return { status: 'unknown', best, sim: bestSim };
}
/* Character diff for showing what differs (LCS on characters, spaces kept). */
function diffHtml(user, model) {
  const a = Array.from(user), b = Array.from(model), m = a.length, n = b.length;
  const L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, ua = '', mb = '';
  while (i < m && j < n) {
    if (a[i] === b[j]) { ua += esc(a[i]); mb += esc(b[j]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { ua += `<del>${esc(a[i])}</del>`; i++; }
    else { mb += `<ins>${esc(b[j])}</ins>`; j++; }
  }
  while (i < m) ua += `<del>${esc(a[i++])}</del>`;
  while (j < n) mb += `<ins>${esc(b[j++])}</ins>`;
  return { user: ua, model: mb };
}
function conceptMarker(cid, input) {
  const c = DB.conceptById[cid]; if (!c || !c.mk) return null;
  try { return new RegExp(c.mk).test(String(input).replace(/\s+/g, '')); } catch (e) { return null; }
}

/* ---------- Korean romanisation (letter-by-letter guide, not phonetic) ---------- */
const RR_I = ['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
const RR_V = ['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
const RR_F = ['','k','k','k','n','n','n','t','l','k','m','l','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
const RR_FL = {1:'g',2:'kk',4:'n',7:'d',8:'r',16:'m',17:'b',19:'s',20:'ss',22:'j',23:'ch',24:'k',25:'t',26:'p'};
function romanizeKo(str) {
  const ch = Array.from(str); let out = '';
  for (let k = 0; k < ch.length; k++) {
    const c = ch[k].charCodeAt(0);
    if (c < 0xAC00 || c > 0xD7A3) { out += ch[k]; continue; }
    const s = c - 0xAC00, ini = Math.floor(s / 588), med = Math.floor((s % 588) / 28), fin = s % 28;
    out += RR_I[ini] + RR_V[med];
    const nx = ch[k + 1] ? ch[k + 1].charCodeAt(0) : 0;
    const nextIsVowelStart = nx >= 0xAC00 && nx <= 0xD7A3 && Math.floor((nx - 0xAC00) / 588) === 11;
    if (fin) out += (nextIsVowelStart && RR_FL[fin]) ? RR_FL[fin] : RR_F[fin];
    if (nextIsVowelStart && fin === 27) { /* ㅎ before vowel is silent */ }
  }
  return out.replace(/ngg/g, 'ngg');
}

const KS = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
function sinoUnder10k(x) { let s = ''; for (const [u, nm] of [[1000, '천'], [100, '백'], [10, '십']]) { const q = Math.floor(x / u); if (q) s += (q === 1 ? '' : KS[q]) + nm; x %= u; } if (x) s += KS[x]; return s; }
function sinoKo(n) { if (n === 0) return '영'; const man = Math.floor(n / 10000), rest = n % 10000; let s = ''; if (man) s += (man === 1 ? '' : sinoUnder10k(man)) + '만'; if (rest) s += (man ? ' ' : '') + sinoUnder10k(rest); return s; }

const JD = { k: ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう'], r: ['', 'ichi', 'ni', 'san', 'yon', 'go', 'roku', 'nana', 'hachi', 'kyū'] };

/* ---------- speech synthesis (only on-device voices) ---------- */
const TTS = {
  ok: !!(window.speechSynthesis && window.SpeechSynthesisUtterance), voices: [],
  load() {
    if (!this.ok) return;
    const get = () => { this.voices = speechSynthesis.getVoices() || []; };
    get(); try { speechSynthesis.addEventListener('voiceschanged', get); } catch (e) { speechSynthesis.onvoiceschanged = get; }
  },
  /* Only voices that report localService (installed on the device). Network voices are excluded on purpose. */
  list(lang) { return this.voices.filter(v => v.lang && v.lang.toLowerCase().replace('_', '-').startsWith(lang) && v.localService !== false); },
  voice(lang) { const l = this.list(lang); if (!l.length) return null; const pref = lang === 'ko' ? S.settings.voiceKo : S.settings.voiceJa; return l.find(v => v.name === pref) || l[0]; },
  has(lang) { return this.ok && !!this.voice(lang); },
  speak(text, lang, slow, onend) {
    if (!this.has(lang)) return false;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); const v = this.voice(lang);
      u.voice = v; u.lang = v.lang; u.rate = (slow ? 0.65 : 1) * S.settings.rate;
      if (onend) u.onend = onend;
      speechSynthesis.speak(u); return true;
    } catch (e) { return false; }
  },
  stop() { try { this.ok && speechSynthesis.cancel(); } catch (e) {} }
};

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) { let t = $('#toast'); if (!t) return; t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

  rules: ['오른쪽으로 가면 약국이 있어요', '비가 오면 공원에 안 가요', '쿠키를 만들면 전화하세요', 'Very common in directions: 쭉 가시면 돼요 (just go straight)'],
  eg: [['질문이 있으면 물어보세요.', 'If you have a question, ask.'], ['오른쪽으로 가시면 돼요.', 'You just need to go right.']],
  err: ['먹면 ✗ → 먹으면'] });
CONCEPT({ id: 'L3-havenot', l: 'L3', t: '있는 / 없는 + noun — with / without', diff: 2, travel: 3, mk: '(있는|없는)',
  ex: '있다/없다 + 는 + noun describes something that has / doesn\'t have something. Very useful for food requests and describing what you need.',
  rules: ['고기가 없는 비빔밥 (bibimbap without meat)', '알러지가 있는 사람 (a person with allergies)', 'Natural alternatives: 고기 없이, 고기 빼고 (leave out the meat)'],
  eg: [['고기 없는 비빔밥 주세요.', 'Bibimbap with no meat, please.'], ['숲이 있는 섬', 'an island with a forest']],
  err: ['고기가 없은 ✗ → 없는'] });
CONCEPT({ id: 'L3-rel', l: 'L3', t: 'Verb + 는 + noun — the noun that (someone) does', diff: 3, travel: 2, mk: '는',
  ex: 'Present-tense relative clause: verb stem + 는 + noun. Inside the clause the subject takes 이/가, never 은/는: 제가 좋아하는 음식 (not 저는 좋아하는 음식).',
  rules: ['한국어를 공부하는 사람 (people who study Korean)', '제가 매일 읽는 책 (the book I read every day)', 'ㄹ stems drop ㄹ: 살다 → 사는 집'],
  eg: [['제가 지금 사는 집은 아늑해요.', 'The house I live in now is cosy.'], ['김치는 한국 사람들이 매일 먹는 반찬이에요.', 'Kimchi is a side dish Koreans eat every day.']],
  err: ['저는 좋아하는 음식 ✗ → 제가 좋아하는 음식', '살는 ✗ → 사는'] });
CONCEPT({ id: 'L3-neg', l: 'L3', t: '지 않다 — not (= 안)', diff: 1, travel: 2, mk: '지않',
  ex: 'Stem + 지 않아요 is the long negative; same meaning as 안 + verb, slightly more neutral/written. Tense goes on 않다: 않았어요, 않을 거예요.',
  rules: ['가지 않아요 = 안 가요', '가지 않았어요 (past), 가지 않을 거예요 (future)', 'Honorific: 가지 않으세요'],
  eg: [['이 김치는 맵지 않아요.', 'This kimchi isn\'t spicy.'], ['내일은 비가 오지 않을 거예요.', 'It won\'t rain tomorrow.']],
  err: ['안 공부해요 ✗ → 공부 안 해요 (안 goes before 하다)'] });

CONCEPT({ id: 'L7-can', l: 'L7', t: 'ㄹ/을 수 있다 / 없다 — can / cannot', diff: 2, travel: 3, mk: '수(있|없)',
  ex: 'Stem + ㄹ/을 수 있어요 = it\'s possible / I can. 수 없어요 = cannot (slightly more formal than 못). 받침 X + ㄹ, 받침 O + 을, ㄹ stem + 수 (no extra ㄹ).',
  rules: ['갈 수 있어요, 먹을 수 있어요, 만들 수 있어요', 'Questions to staff: 카드로 계산할 수 있어요?', '짐을 맡길 수 있어요?'],
  eg: [['여기에서 표를 살 수 있어요?', 'Can I buy a ticket here?'], ['영어로 말할 수 있어요?', 'Can you speak English?']],
  err: ['만들을 수 ✗ → 만들 수', '먹는 수 ✗ → 먹을 수'] });
CONCEPT({ id: 'L7-dont', l: 'L7', t: '지 마세요 — please don\'t', diff: 1, travel: 2, mk: '지마',

CONCEPT({ id: 'L7-reason', l: 'L7', t: '아/어서 — so, because (reason → result)', diff: 2, travel: 3, mk: '서',
  ex: 'Reason clause + 아/어서 + result. The first clause never takes tense; the tense goes in the final verb. You cannot end the sentence with a command or suggestion after a reason 아서 (use (으)니까 for that).',
  rules: ['너무 비싸서 못 샀어요 (not 비쌌어서)', '아침을 안 먹어서 배고파요', 'Nouns use (이)라서'],

CONCEPT({ id: 'L8-ttae', l: 'L8', t: 'ㄹ/을 때 — when', diff: 2, travel: 2, mk: '때',
  ex: 'Stem + ㄹ/을 때 = "when (doing / being)". Past: 았/었을 때 (when I was / did). For "when X happens, I will…" in the future, (으)면 often sounds more natural.',
  rules: ['밥 먹을 때 젓가락을 사용해요', '비가 올 때 기분이 좋아요', '케이크를 만들 때 (ㄹ stem)', '미국에 갔을 때 (past)', '어리다 = young (relatively); 젊다 = young (not old)'],
  eg: [['한국에 처음 왔을 때 한국어를 못 했어요.', 'When I first came to Korea I couldn\'t speak Korean.'], ['내릴 때 카드를 찍으세요.', 'Tap your card when you get off.']],
  err: ['먹는 때 ✗ → 먹을 때'] });
CONCEPT({ id: 'L8-geona', l: 'L8', t: '거나 — either … or (verbs/adjectives)', diff: 1, travel: 2, mk: '거나',
  ex: 'Stem + 거나 offers alternatives between actions or states.',
  rules: ['책을 읽거나 방 청소해요', '맵거나 짜요', 'For nouns use (이)나'],
  eg: [['택시를 타거나 걸어가도 돼요.', 'You can take a taxi or walk.'], ['달거나 기름진 음식', 'sweet or greasy food']],
  err: ['커피거나 차 ✗ → 커피나 차'] });
CONCEPT({ id: 'L8-na', l: 'L8', t: '(이)나 — noun or noun; 아니면 for choice questions', diff: 1, travel: 3, mk: '(이나|나|아니면)',
  ex: 'Noun + (이)나 + noun = A or B (statement). 받침 O + 이나. When you ask someone to choose, Korean usually asks two questions: 커피 드릴까요? 아니면 차 드릴까요?',
  rules: ['커피나 주스, 명동이나 강남', '비빔밥 드릴까요? 치킨 드릴까요?', 'Staff choice question: 드시고 가세요? 포장이세요?'],
  eg: [['카드나 현금 다 돼요.', 'Card or cash, both fine.'], ['버스 탈까요? 아니면 택시 탈까요?', 'Shall we take a bus, or a taxi?']],
  err: ['명동나 ✗ → 명동이나'] });
CONCEPT({ id: 'L8-permit', l: 'L8', t: '아/어도 돼요? — may I? / is it OK to?', diff: 1, travel: 3, mk: '도돼',
  ex: 'Stem + 아/어도 돼요? asks permission. Answers: 네, ~아/어도 돼요 / 네, ~세요 or 아니요, ~(으)면 안 돼요.',
  rules: ['사진 찍어도 돼요?', '여기 앉아도 돼요?', '이거 먹어도 돼요?'],
  eg: [['여기서 사진 찍어도 돼요?', 'May I take photos here?'], ['짐을 여기 둬도 돼요?', 'May I leave the bags here?']],
  err: ['먹어도 안 돼요 ✗ → 먹으면 안 돼요'] });
CONCEPT({ id: 'L8-forbid', l: 'L8', t: '(으)면 안 돼요 — must not / not allowed', diff: 1, travel: 3, mk: '면안돼',
  ex: 'Stem + (으)면 안 돼요 = it is not allowed. You will hear it as the "no" answer to 아/어도 돼요?',
  rules: ['여기서 담배 피우면 안 돼요', '음식을 가지고 들어가면 안 돼요'],
  eg: [['여기는 신발 신고 들어가면 안 돼요.', 'You can\'t go in here wearing shoes.']],
  err: ['안 하면 돼요 means "you just need to not do it" — different!'] });
CONCEPT({ id: 'L8-noneed', l: 'L8', t: '안 아/어도 돼요 — don\'t have to', diff: 2, travel: 3, mk: '(안[가-힣]+도돼|지않아도돼)',
  ex: '안 + verb + 아/어도 돼요 (or 지 않아도 돼요) = it\'s OK not to / you don\'t have to. Compare 요리하면 안 돼요 (you must not cook) vs 요리 안 해도 돼요 (you don\'t have to cook).',
  rules: ['예약 안 해도 돼요 (no reservation needed)', '신발 안 벗어도 돼요 (no need to take off shoes)', '다 안 먹어도 돼요'],
  eg: [['여권은 안 가져와도 돼요.', 'You don\'t need to bring your passport.'], ['기다리지 않아도 돼요.', 'You don\'t have to wait.']],
  err: ['안 해야 돼요 ✗ (means "must not do") — for "don\'t have to" use 안 해도 돼요'] });

MK('LK2-1', 'L1-hon-special', `

MK('LK2-4', 'L4-but', `

MK('LK2-4', 'L4-mot', `

MK('LK2-9', 'L9-myeonseo', `

MK('LK2-9', 'L9-jiyo', `

MK('LK2-5', 'L5-reo', `

MK('LK2-6', 'L6-reu', `

MK('LK2-6', 'L6-must', `

MK('LK2-2', 'L2-eu', `
요즘 너무 바쁘어요. => 요즘 너무 바빠요. # 으 irregular: ㅡ drops and 아 is chosen because of 바.

MK('LK2-2', 'L2-adj', `

MK('LK2-2', 'L2-rieul', `

MK('LK2-8', 'L8-forbid', `

MK('LK2-8', 'L8-noneed', `
내일은 숙제 안 해야 돼요. => 내일은 숙제 안 해도 돼요. # "Don't have to" is 안 + 아/어도 돼요; 안 해야 돼요 means "must not".

MK('LK2-8', 'L8-na', `
커피거나 차를 마셔요. => 커피나 차를 마셔요. # Nouns take (이)나; 거나 is for verbs/adjectives.

MK('LK2-7', 'L7-can', `
케이크를 만들을 수 있어요. => 케이크를 만들 수 있어요. # ㄹ stems take 수 directly.

  { id: 'sp2', place: 'Busan', sit: 'Order three bowls of pork soup and two bowls of 순대국밥 (blood-sausage soup).', kw: ['세 그릇', '두 그릇', '주세요'], gr: 'R-count', frame: '돼지국밥 ___ 그릇하고 순대국밥 ___ 그릇 주세요.', model: ['돼지국밥 세 그릇하고 순대국밥 두 그릇 주세요.'], alts: ['돼지국밥 세 개하고 순대국밥 두 개 주세요.', '돼지국밥 셋, 순대국밥 둘 주세요.'], note: 'Bowls: 그릇. 개 is also widely accepted when ordering.',
    fu: { ko: '다 보통으로 드릴까요? 아이들 것은 안 맵게 해 드릴까요?', en: 'Shall I make them all regular? Shall I make the kids\' ones not spicy?', model: ['네, 아이들 것은 안 맵게 해 주세요.', '네, 두 개는 안 맵게 해 주세요.'], note: '것 = "the ones (for)". 안 맵게 해 주세요 = please make it not spicy.' } },
  { id: 'sp3', place: 'Seoul', sit: 'Ask the server what the most popular dish is.', kw: ['제일', '맛있다 / 인기'], gr: 'R-recover', frame: '여기 뭐가 제일 ___?', model: ['여기 뭐가 제일 맛있어요?', '뭐가 제일 인기 많아요?'], alts: ['추천해 주세요.', '추천 메뉴가 뭐예요?'], note: '뭐가 제일 맛있어요? is the everyday way to ask for a recommendation.',
    fu: { ko: '저희는 갈비탕이 제일 잘 나가요. 근데 갈비는 2인분부터 주문 가능해요.', en: 'Our best seller is galbitang. But galbi can only be ordered from 2 portions.', model: ['그럼 갈비탕 다섯 개 주세요.', '갈비 삼 인분하고 갈비탕 두 개 주세요.'], note: '잘 나가요 = sells well. 2인분부터 = from two portions.' } },
  { id: 'sp4', place: 'Ulsan', sit: 'Your dad can\'t eat seafood. Ask if this stew has seafood in it.', kw: ['해산물', '들어가다'], gr: 'L9-jiyo', frame: '이 찌개에 해산물 ___?', model: ['이 찌개에 해산물 들어가요?'], alts: ['이거 해산물 들어 있어요?', '이 찌개에 해산물이 있어요?'], note: '들어가요? = does it go in / contain?',
    fu: { ko: '네, 새우가 조금 들어가요. 빼 드릴까요?', en: 'Yes, there\'s a little shrimp in it. Shall I take it out?', model: ['네, 빼 주세요. 아버지가 해산물을 못 드세요.'], note: '빼 주세요 = please leave it out. 드세요 honours your father.' } },
  { id: 'sp5', place: 'Seoul', sit: 'Ask for less spicy food because the kids can\'t eat spicy food.', kw: ['아이들', '매운 음식', '못', '덜 맵게'], gr: 'L7-reason', frame: '아이들이 ___ 못 먹어서 ___ 해 주세요.', model: ['아이들이 매운 음식을 못 먹어서 덜 맵게 해 주세요.'], alts: ['아이들이 매운 걸 못 먹어요. 안 맵게 해 주세요.', '덜 맵게 해 주세요.'], note: 'Reason 아서 + request 주세요 is fine because 주세요 is a request, not a command after a past fact.',
    fu: { ko: '이 메뉴는 원래 매운 거라서 안 맵게는 안 돼요. 대신 된장찌개는 어떠세요?', en: 'This dish is spicy by nature so it can\'t be made non-spicy. How about doenjang stew instead?', model: ['그럼 된장찌개 두 개 주세요.', '네, 좋아요. 된장찌개로 주세요.'], note: '안 돼요 = not possible. 대신 = instead. (으)로 주세요 = "make it ~, please".' } },
  { id: 'sp6', place: 'Busan', sit: 'You want to pay. Ask for the bill and whether you can pay by card.', kw: ['계산', '카드'], gr: 'L7-can', frame: '계산해 주세요. 카드로 ___?', model: ['계산해 주세요. 카드 돼요?', '계산할게요. 카드로 할 수 있어요?'], alts: ['여기 계산이요. 카드로 계산해도 돼요?'], note: '카드 돼요? = "Does card work?" — very common.',
    fu: { ko: '계산은 나가실 때 카운터에서 하시면 돼요.', en: 'You can pay at the counter on your way out.', model: ['아, 네. 감사합니다.'], note: '나가실 때 = when you go out. 하시면 돼요 = you just need to do it.' } },
  { id: 'sp7', place: 'Geoje', sit: 'Ask the taxi driver to take you to the ferry terminal for 외도 island.', kw: ['외도', '유람선 터미널', '가 주세요'], gr: 'L5-ro', frame: '___ 가는 유람선 터미널로 가 주세요.', model: ['외도 가는 유람선 터미널로 가 주세요.'], alts: ['외도 유람선 타는 곳으로 가 주세요.', '외도 가는 배 타는 곳으로 가 주세요.'], note: 'Relative clause 가는 + noun (L3): "the terminal that goes to Oedo".',
    fu: { ko: '거제에 터미널이 몇 군데 있는데 어느 쪽이에요? 장승포요, 지세포요?', en: 'Geoje has a few terminals — which one? Jangseungpo or Jisepo?', model: ['죄송한데 잘 모르겠어요. 여기 주소가 있어요.', '지세포요.'], note: 'If you\'re unsure, show the address — that is good communication, not failure.' } },
  { id: 'sp8', place: 'Seoul', sit: 'Tell the taxi driver to stop here.', kw: ['여기', '세우다'], gr: 'L5-juseyo', frame: '여기서 ___ 주세요.', model: ['여기서 세워 주세요.'], alts: ['여기서 내릴게요.', '여기에서 내려 주세요.'], note: '세우다 = to stop (a vehicle).',
    fu: { ko: '여기는 정차가 안 돼서 조금 더 가서 내려 드릴게요.', en: 'You can\'t stop here, so I\'ll drop you a little further on.', model: ['네, 괜찮아요.', '네, 알겠습니다.'], note: '정차 = stopping. 안 돼서 = because it\'s not allowed.' } },
  { id: 'sp9', place: 'Busan', sit: 'At 부산역, ask where to transfer to get to Haeundae.', kw: ['해운대', '어디에서', '갈아타다'], gr: 'L6-must', frame: '해운대에 가려면 어디에서 ___?', model: ['해운대에 가려면 어디에서 갈아타야 돼요?'], alts: ['해운대 가고 싶은데 어디에서 갈아타요?', '해운대에 어떻게 가요?'], note: '-려면 = "if you intend to". If you forget it, 해운대에 어떻게 가요? works.',
    fu: { ko: '서면역에서 2호선으로 갈아타시면 돼요.', en: 'You can transfer to Line 2 at Seomyeon.', model: ['서면역에서 2호선이죠? 감사합니다.'], note: 'Confirm with 죠 (L9) — it shows you understood and catches mistakes.' } },
  { id: 'sp10', place: 'Ulsan', sit: 'At a bus stop, ask whether this bus goes to 대왕암공원.', kw: ['이 버스', '대왕암공원', '가다'], gr: 'L9-jiyo', frame: '이 버스 ___ 가요?', model: ['이 버스 대왕암공원에 가요?', '이 버스 대왕암공원 가죠?'], alts: ['대왕암공원 가는 버스 맞아요?'], note: '맞아요? = is that right?',
    fu: { ko: '아니요, 이건 반대 방향이에요. 길 건너편에서 타세요.', en: 'No, this is the opposite direction. Take it from across the road.', model: ['아, 건너편이요? 감사합니다.'], note: 'Echo the key word as a question — 건너편이요? — to confirm.' } },
  { id: 'sp11', place: 'Seoul', sit: 'At the hotel front desk, say you have a reservation under the name Rina.', kw: ['예약', '리나', '인데요'], gr: 'L5-nde', frame: '___ 이름으로 예약했는데요.', model: ['리나 이름으로 예약했는데요.'], alts: ['체크인하려고 하는데요. 리나로 예약했어요.', '안녕하세요. 리나 이름으로 예약했어요.'], note: '(이름)으로 예약했는데요 = I booked under (name).',
    fu: { ko: '체크인은 세 시부터라서 짐을 맡기시고 나중에 오셔도 돼요.', en: 'Check-in is from 3, so you can leave your bags and come back later.', model: ['네, 짐 좀 맡겨 주세요. 몇 시에 다시 오면 돼요?'], note: '맡기다 = leave in someone\'s care. -면 돼요 = it\'s enough if…' } },
  { id: 'sp12', place: 'Seoul', sit: 'Ask the hotel if you can leave your luggage after check-out.', kw: ['체크아웃', '짐', '맡기다', '수 있다'], gr: 'L7-can', frame: '체크아웃 후에 짐을 ___ 수 있어요?', model: ['체크아웃 후에 짐을 맡길 수 있어요?'], alts: ['체크아웃하고 짐 좀 맡겨도 돼요?'], note: 'Both 수 있어요 (L7) and 아도 돼요 (L8) work here.',
    fu: { ko: '네, 몇 시에 찾으러 오실 거예요?', en: 'Yes, what time will you come to collect them?', model: ['네 시쯤 찾으러 올 거예요.'], note: '찾으러 오다 = come to pick up (L5 러 + L3 거예요).' } },
  { id: 'sp13', place: 'Seoul', sit: 'The air-conditioning in your room isn\'t working. Tell reception.', kw: ['에어컨', '안 되다', '방 번호'], gr: 'L5-nde', frame: '___호인데요, 에어컨이 ___.', model: ['805호인데요, 에어컨이 안 돼요.'], alts: ['방에 에어컨이 고장 났어요. 좀 봐 주세요.', '에어컨이 안 되는데요. 고쳐 주실 수 있어요?'], note: '안 돼요 = doesn\'t work. 고장 났어요 = broke down (L7).',
    fu: { ko: '바로 올려 보내 드릴게요. 혹시 방을 바꿔 드릴까요?', en: 'I\'ll send someone up right away. Or shall we change your room?', model: ['네, 방을 바꿔 주세요.', '아니요, 괜찮아요. 고쳐 주세요.'], note: '바꾸다 = to change.' } },
  { id: 'sp14', place: 'Busan', sit: 'At a market stall, ask how much these are and if you can get a discount for five.', kw: ['얼마', '다섯 개', '깎다'], gr: 'L5-juseyo', frame: '이거 ___예요? 다섯 개 사면 좀 ___ 주세요.', model: ['이거 얼마예요? 다섯 개 사면 좀 깎아 주세요.'], alts: ['이거 얼마예요? 다섯 개 사면 좀 싸게 해 주세요.'], note: '깎아 주세요 = please knock the price down. Markets only; not in department stores.',
    fu: { ko: '하나에 만 원인데 다섯 개면 사만 오천 원에 드릴게요.', en: 'They\'re ₩10,000 each but I\'ll give you five for ₩45,000.', model: ['네, 좋아요. 카드 돼요?', '감사합니다. 다섯 개 주세요.'], note: 'Listen for 에 드릴게요 = "I\'ll give (it) to you for…".' } },
  { id: 'sp15', place: 'Seoul', sit: 'At a clothes shop, ask if you can try this on and whether there is a bigger size.', kw: ['입어 보다', '더 큰 사이즈'], gr: 'L8-permit', frame: '이거 ___ 봐도 돼요? 더 큰 ___ 있어요?', model: ['이거 입어 봐도 돼요? 더 큰 사이즈 있어요?'], alts: ['이거 입어 볼 수 있어요? 더 큰 거 있어요?'], note: '아/어 보다 (L2) + 아/어도 돼요 (L8) = 입어 봐도 돼요.',
    fu: { ko: '피팅룸은 저쪽에 있어요. 큰 사이즈는 지금 창고에 있어서 잠깐만 기다려 주세요.', en: 'The fitting room is over there. The larger size is in the stockroom so please wait a moment.', model: ['네, 기다릴게요.'], note: '창고 = stockroom. 잠깐만 = just a moment.' } },
  { id: 'sp16', place: 'Seoul', sit: 'Ask what time the palace closes.', kw: ['몇 시', '문을 닫다'], gr: 'R-recover', frame: '여기 몇 시에 ___?', model: ['여기 몇 시에 문 닫아요?'], alts: ['몇 시까지 해요?', '영업시간이 어떻게 되세요?'], note: '몇 시까지 해요? = until what time are you open? — very common.',
    fu: { ko: '여섯 시에 닫는데 입장은 다섯 시까지예요.', en: 'It closes at 6 but last entry is at 5.', model: ['아, 그럼 빨리 들어가야겠네요.', '다섯 시까지요? 알겠습니다.'], note: '입장 = entry. Two times in one sentence — listen for both.' } },
  { id: 'sp17', place: 'Seoul', sit: 'You\'re lost. Ask a passer-by politely how to get to 경복궁.', kw: ['실례지만', '경복궁', '어떻게 가요'], gr: 'L6-time', frame: '실례지만, ___에 어떻게 가요?', model: ['실례지만, 경복궁에 어떻게 가요?'], alts: ['저기요, 경복궁 어떻게 가요?', '죄송한데 경복궁이 어디예요?'], note: '실례지만 (excuse me, but) uses 지만 from L4.',
    fu: { ko: '여기서 좀 먼데요. 3호선 타고 경복궁역에서 내리세요. 5번 출구로 나가시면 바로 있어요.', en: 'It\'s quite far from here. Take Line 3 and get off at Gyeongbokgung Station. It\'s right there when you go out exit 5.', model: ['3호선, 경복궁역, 5번 출구요? 감사합니다!'], note: 'Repeat the three key facts back — line, station, exit.' } },
  { id: 'sp18', place: 'Busan', sit: 'A shopkeeper says your Korean is good. Respond modestly and say you\'ve studied for a year and a half.', kw: ['아직', '일 년 반', '공부하다'], gr: 'L9-goitda', frame: '아니에요, 아직 잘 못 해요. 일 년 반 동안 ___.', model: ['아니에요, 아직 잘 못 해요. 일 년 반 동안 공부했어요.'], alts: ['감사합니다. 일 년 반 정도 배우고 있어요.', '아직 많이 부족해요. 일 년 반 공부했어요.'], note: 'Modest deflection is the natural response to praise.',
    fu: { ko: '어디서 오셨어요? 부산은 처음이세요?', en: 'Where are you from? Is it your first time in Busan?', model: ['말레이시아에서 왔어요. 네, 부산은 처음이에요.'], note: 'Two questions — answer both in order.' } },
  { id: 'sp19', place: 'Geoje', sit: 'Explain that you speak some Korean but would like the staff to speak slowly.', kw: ['조금', '천천히', '말씀하다'], gr: 'L4-but', frame: '한국어를 조금 ___ 천천히 말씀해 주세요.', model: ['한국어를 조금 하지만 천천히 말씀해 주세요.', '한국어를 조금 할 수 있어요. 천천히 말씀해 주세요.'], alts: ['한국어를 조금 하는데요, 천천히 말씀해 주시겠어요?'], note: 'Setting expectations early makes the rest of the conversation easier.',
    fu: { ko: '아, 네. 천천히 할게요. 어디 가세요?', en: 'Ah, OK. I\'ll speak slowly. Where are you going?', model: ['바람의 언덕에 가요.'], note: '' } },
  { id: 'sp20', place: 'Seoul', sit: 'Ask the KTX staff which car and seat numbers are on your ticket (show the ticket).', kw: ['몇 호차', '자리'], gr: 'R-sino', frame: '이 표 ___ 호차예요? 자리가 어디예요?', model: ['이 표 몇 호차예요? 자리가 어디예요?'], alts: ['이거 몇 호차 몇 번이에요?'], note: '호차 = train car number (Sino numbers).',
    fu: { ko: '칠 호차 십이 번부터 십육 번까지예요. 이쪽으로 쭉 가세요.', en: 'Car 7, seats 12 to 16. Go straight this way.', model: ['칠 호차요? 감사합니다.'], note: '부터 ~ 까지 = from … to (numbers).' } },
  { id: 'sp21', place: 'Busan', sit: 'Ask the convenience store clerk to heat up this lunch box.', kw: ['데우다', '주세요'], gr: 'L5-juseyo', frame: '이거 좀 ___ 주세요.', model: ['이거 좀 데워 주세요.'], alts: ['이거 데워 주실 수 있어요?', '전자레인지 써도 돼요?'], note: '데우다 = to heat up. If you forget it: 따뜻하게 해 주세요.',
    fu: { ko: '전자레인지는 저쪽에 있어요. 직접 하시면 돼요.', en: 'The microwave is over there. You can do it yourself.', model: ['아, 네. 감사합니다.'], note: '직접 = yourself, directly.' } },
  { id: 'sp22', place: 'Seoul', sit: 'Your mum wants to know if she can take photos inside. Ask the staff.', kw: ['안에서', '사진', '찍다', '도 돼요'], gr: 'L8-permit', frame: '안에서 사진 ___ 돼요?', model: ['안에서 사진 찍어도 돼요?'], alts: ['여기서 사진 찍어도 돼요?'], note: '',
    fu: { ko: '사진은 되는데 플래시는 쓰시면 안 돼요.', en: 'Photos are fine but you can\'t use flash.', model: ['네, 알겠습니다. 플래시 안 쓸게요.'], note: 'Listen for the "but" (는데) — the restriction comes after it.' } },
  { id: 'sp23', place: 'Ulsan', sit: 'Ask how long it takes to walk to the beach from here.', kw: ['여기에서', '해변', '걸어서', '얼마나'], gr: 'L6-time', frame: '여기에서 ___까지 걸어서 얼마나 ___?', model: ['여기에서 해변까지 걸어서 얼마나 걸려요?'], alts: ['해변까지 걸어서 갈 수 있어요?'], note: '',
    fu: { ko: '걸어서 이십 분쯤 걸리는데 버스 타면 오 분이면 가요.', en: 'It takes about 20 minutes on foot, but by bus you\'ll be there in 5.', model: ['그럼 버스 탈게요. 몇 번 버스예요?'], note: 'Two numbers: 20 minutes walking, 5 minutes by bus.' } },
  { id: 'sp24', place: 'Seoul', sit: 'Tell a pharmacist your mother has a headache and ask for medicine.', kw: ['어머니', '머리가 아프다', '약'], gr: 'L1-hon-verb', frame: '어머니가 머리가 ___. 약 좀 주세요.', model: ['어머니가 머리가 아프세요. 두통약 좀 주세요.', '어머니가 머리가 아프세요. 약 좀 주세요.'], alts: ['엄마가 머리가 아파요. 약 있어요?'], note: '아프세요 honours your mother (L1).',
    fu: { ko: '혹시 드시는 약 있으세요? 알레르기는요?', en: 'Is she taking any medication? Any allergies?', model: ['아니요, 없어요.', '네, 혈압약을 드세요.'], note: '드시는 약 = medication she takes (honorific 드시다 + 는 + noun).' } },

/* ---------- register non-text content as items ---------- */
function registerContent() {
  DB.ko.sp.forEach(x => addItem('sp', Object.assign(x, { id: 'sp:' + x.id, t: 1 })));
  DB.ko.rc.forEach(x => addItem('rc', Object.assign(x, { id: 'rc:' + x.id, t: 1 })));
  DB.ko.rs.forEach(x => addItem('rs', Object.assign(x, { id: 'rs:' + x.id })));
  DB.ko.li.forEach(x => addItem('li', Object.assign(x, { id: 'li:' + x.id, t: 1 })));
  DB.ko.ip.forEach(x => addItem('ip', Object.assign(x, { id: 'ip:' + x.id, t: 1 })));
  DB.ko.cv.forEach(x => addItem('cv', Object.assign(x, { id: 'cv:' + x.id, lang: 'ko' })));
  DB.ko.bb.forEach(x => addItem('bb', Object.assign(x, { id: 'bb:' + x.id, lang: 'ko' })));
  DB.ko.dl.forEach((x, i) => addItem('dl', Object.assign(x, { id: 'dl:' + i })));
  DB.ko.mp.forEach((x, i) => addItem('mp', { id: 'mp:' + i, a: x[0], b: x[1], en: x[2], src: x[3], lang: 'ko' }));
  DB.ko.phrases.forEach((x, i) => { const o = { id: 'kp:' + i, cat: x[0], ko: x[1], en: x[2], note: x[3], reply: x[4] || null }; DB.ko.phrasesObj = DB.ko.phrasesObj || []; DB.ko.phrasesObj.push(o); DB.items[o.id] = o; });
  DB.ja.cv.forEach(x => addItem('jcv', Object.assign(x, { id: 'jcv:' + x.id })));
  DB.ja.mp.forEach((x, i) => addItem('jmp', { id: 'jmp:' + i, a: x[0], b: x[1], en: x[2], lang: 'ja' }));
  DB.ja.days.forEach(d => {
    d.missions.forEach((m, i) => addItem('jday', { id: `jday:${d.d}:${i}`, title: m.title, place: d.title, brief: `Day ${d.d} · ${d.date}`, steps: m.steps, lang: 'ja', day: d.d }));
    addItem('jwrong', { id: `jwrong:${d.d}`, title: 'What could go wrong?', place: d.title, brief: d.wrong.sit, steps: [{ k: 'pick', npc: d.wrong.npc, opts: d.wrong.opts }], lang: 'ja', day: d.d });
  });
  Object.keys(NUMGEN).forEach(k => addItem('num', { id: 'num:' + k, gen: k, lang: k.slice(0, 2), t: 1 }));
}

/* ---------- difficulty & modes ---------- */
const DIFFS = ['easy', 'medium', 'hard', 'expert'];
function levelReadiness(lv) {
  const pools = LEVELS[lv - 1].pools; let a = 0, c = 0;
  for (const p of pools) for (const it of (DB.pools[p] || [])) {
    const r = S.items[it.id]; if (!r || !r.a) continue;
    const h = r.hist.slice(-3); a += h.length; c += (h.match(/[ys]/g) || []).length + 0.5 * (h.match(/p/g) || []).length;
  }
  return { a, acc: a ? c / a : 0 };
}
function currentDiff(lv) {
  if (S.settings.diff !== 'auto') return S.settings.diff;
  let d = 'medium';
  if (lv) { const r = levelReadiness(lv); if (r.a >= 8) d = r.acc < 0.5 ? 'easy' : r.acc < 0.7 ? 'medium' : r.acc < 0.85 ? 'hard' : 'expert'; }
  if (S.settings.mode === 'challenge' && DIFFS.indexOf(d) < 2) d = 'hard';
  if (S.settings.mode === 'low' && DIFFS.indexOf(d) > 1) d = 'medium';
  return d;
}
function sizeN(n) { const m = S.settings.mode === 'low' ? 0.6 : S.settings.mode === 'challenge' ? 1.3 : 1; return Math.max(2, Math.round(n * m)); }

/* ---------- item selection ---------- */
function pickFrom(pool, n, filter) {
  let arr = (DB.pools[pool] || []).filter(filter || (() => true));
  arr = arr.map(it => ({ it, p: priority(it) })).sort((a, b) => b.p - a.p).map(x => x.it);
  return arr.slice(0, n);
}
const conceptLesson = it => (DB.conceptById[it.c] || {}).l;
const inLessons = ls => it => ls.includes(conceptLesson(it));
function tokenCount(s) { return s.trim().split(/\s+/).length; }
/* Context sentence for a vocabulary item, built from lesson model answers. */
function contextFor(v) {
  const key = v.ko.replace(/다$/, '');
  if (key.length < 1) return null;
  for (const t of DB.pools.tr || []) {
    const m = t.acc[0];
    if (v.ko.endsWith('다')) continue; // verbs conjugate; only nouns are blanked
    const idx = m.indexOf(v.ko);
    if (idx >= 0 && m.length < 60) return { s: m.slice(0, idx) + '___' + m.slice(idx + v.ko.length), gloss: t.en.replace(/\s*\([^)]*\)\s*/g, ' ').trim(), ans: v.ko, from: t.src };
  }
  return null;
}

/* ---------- session spec → list ----------
   part: {pool, ex, n, f, stage}  →  list entries {ex, id, x}           */
function buildList(spec) {
  const out = [];
  for (const part of spec.parts) {
    const n = part.fixed ? part.n : sizeN(part.n);
    if (part.ex === 'match') {
      for (let k = 0; k < n; k++) { const ids = pickFrom(part.pool, 5, part.f).map(x => x.id); if (ids.length >= 3) out.push({ ex: 'match', id: 'match:' + part.pool + ':' + ids.join(','), x: { ids, pool: part.pool } }); }
      continue;
    }
    if (part.ex === 'context') {
      const cands = pickFrom('v', 60, part.f).map(v => ({ v, c: contextFor(v) })).filter(o => o.c).slice(0, n);
      cands.forEach(o => out.push({ ex: 'context', id: o.v.id, x: o.c }));
      continue;
    }
    if (part.pool === 'num') {
      const gens = part.gens || Object.keys(NUMGEN).filter(k => k.startsWith(part.lang || 'ko'));
      for (let k = 0; k < n; k++) out.push({ ex: part.ex || 'listen', id: 'num:' + pick(gens), x: {} });
      continue;
    }
    let f = part.f;
    if (part.ex === 'scramble') { const f0 = f; f = it => (!f0 || f0(it)) && tokenCount(it.acc[0]) >= 3 && tokenCount(it.acc[0]) <= 9 && !/[A-Za-z0-9○_]/.test(it.acc[0]); }
    if ((part.ex === 'pair') && !TTS.has(part.pool === 'jmp' ? 'ja' : 'ko')) continue;
    pickFrom(part.pool, n, f).forEach(it => out.push({ ex: part.ex, id: it.id, x: part.stage ? { stage: part.stage } : {} }));
  }
  return spec.noShuffle ? out : interleave(out);
}
function interleave(list) {
  const by = {}; list.forEach(e => (by[e.ex] = by[e.ex] || []).push(e));
  const keys = shuffle(Object.keys(by)); const res = []; let more = true;
  while (more) { more = false; for (const k of keys) { if (by[k].length) { res.push(by[k].shift()); more = true; } } }
  return res;
}

/* ---------- runner ---------- */
let RUN = null; // {spec, list, i, res, started, conf}
function startSession(spec) {
  const list = spec.list || buildList(spec);
  if (!list.length) { toast(spec.emptyMsg || 'Nothing to practise here yet.'); return; }
  RUN = { key: spec.key, title: spec.title, lang: spec.lang || 'ko', lv: spec.lv || 0, list, i: 0, res: [], started: now(), quest: spec.quest || null, brave: !!spec.brave, confBefore: null };
  S.cur = { key: RUN.key, title: RUN.title, lang: RUN.lang, lv: RUN.lv, list: RUN.list, i: 0, res: [], quest: RUN.quest, brave: RUN.brave };
  save(true);
  goRun();
}
function goRun() { if (location.hash === '#run') route(); else location.hash = '#run'; }
function resumeSession() { if (!S.cur) return false; RUN = Object.assign({ started: now() }, S.cur); RUN.res = S.cur.res || []; if (location.hash !== '#run') location.hash = '#run'; return true; }
function quitSession(keep) { TTS.stop(); clearTimer(); if (!keep) { S.cur = null; } save(true); RUN = null; location.hash = '#home'; }

function renderRun() {
  if (!RUN) { if (!resumeSession()) { location.hash = '#home'; return; } }
  document.body.classList.add('running');
  const root = $('#app');
  if (RUN.brave && RUN.confBefore == null && RUN.i === 0) return renderBraveIntro(root);
  if (RUN.i >= RUN.list.length) return renderSummary(root);
  const e = RUN.list[RUN.i];
  root.innerHTML = `<div class="run">
    <div class="head"><div class="in">
      <button class="iconbtn" data-act="runExit" aria-label="Pause and leave">${ICON.x}</button>
      <div class="bar" role="progressbar" aria-valuenow="${RUN.i}" aria-valuemax="${RUN.list.length}"><i style="width:${(RUN.i / RUN.list.length) * 100}%"></i></div>
      <span class="small muted" style="min-width:42px;text-align:right">${RUN.i + 1}/${RUN.list.length}</span>

    </div></div>
    <main id="ex"></main>
    <div class="foot"><div class="in" id="foot"></div></div></div>`;
  const it = e.id.startsWith('match:') ? null : DB.items[e.id];
  if (!it && !e.id.startsWith('match:')) { RUN.i++; return renderRun(); }
  const ctx = makeCtx(e, it);

}
function makeCtx(e, it) {
  const box = $('#ex');

    e, it, box, lang: (it && it.lang) || RUN.lang,
    diff: currentDiff(RUN.lv),
    set(html) { box.innerHTML = html; },
    add(html) { const d = document.createElement('div'); d.innerHTML = html; while (d.firstChild) box.appendChild(d.firstChild); return box.lastElementChild; },
    foot: footBtns,
    finish(r) {
      if (this._done) return; this._done = true;
      const rec = Object.assign({ score: 0, self: false, kind: 'recall', hint: false }, r);
      if (!e.id.startsWith('match:') && !e.id.startsWith('num:') && !(rec.noRecord)) recordItem(e.id, rec);
      else if (e.id.startsWith('num:')) recordItem(e.id, rec);
      RUN.res.push({ id: e.id, ex: e.ex, score: rec.score, self: rec.self, kind: rec.kind });
      if (rec.score < 0.75 && RUN.list.length < 60 && !['convo', 'boss', 'match'].includes(e.ex) && !e.requeued) {
        const again = Object.assign({}, e, { requeued: true }); RUN.list.splice(Math.min(RUN.list.length, RUN.i + 4), 0, again); // delayed recall within the session
      }

}
function advance() { TTS.stop(); clearTimer(); RUN.i++; if (S.cur) { S.cur.i = RUN.i; S.cur.list = RUN.list; save(); } renderRun(); }
function footBtns(btns) {

function timerHtml() { const t = S.settings.timer; if (t === 'off') return ''; return `<span class="timer" id="tmr">${t === 'gentle' ? 30 : 12}s</span>`; }
function startTimer() {
  clearTimer(); const t = S.settings.timer; if (t === 'off') return;
  let s = t === 'gentle' ? 30 : 12; const el = () => $('#tmr');
  TMR = setInterval(() => { s--; const e = el(); if (!e) return clearTimer(); if (s <= 0) { e.textContent = 'Time — answer when ready'; clearTimer(); } else e.textContent = s + 's'; }, 1000);
}

/* ---------- shared UI pieces ---------- */
function speakBtn(text, lang, id) {
  if (!TTS.has(lang)) return '';
  return `<span class="row" style="gap:6px"><button class="btn small play" data-say="${esc(text)}" data-lang="${lang}" ${id ? `id="${id}"` : ''}>${ICON.play} Play</button><button class="btn small ghost" data-say="${esc(text)}" data-lang="${lang}" data-slow="1">Slow</button></span>`;
}
function romKo(s) { return S.settings.romKo ? `<div class="rom">${esc(romanizeKo(s))}</div>` : ''; }
function stripHints(en) { return en.replace(/\s*\([^)]*[가-힣][^)]*\)/g, ''); }
function hintParen(en) { const m = en.match(/\([^)]*[가-힣][^)]*\)/g) || []; return m.map(x => x.slice(1, -1)); }
function conceptChip(cid) { const c = DB.conceptById[cid]; if (!c) return ''; return `<button class="chip" data-act="conceptSheet" data-arg="${esc(cid)}" title="Open grammar note">${esc(c.l === 'REF' ? 'Refresher' : (DB.lessons.find(l => l.id === c.l) || {}).src || c.l)} · ${esc(c.t.split('—')[0].trim())}</button>`; }
function srcLabel(it) { return it && it.src ? `<span class="tag">${esc(it.src)}</span>` : ''; }
function selfRow(onPick, labels) {
  labels = labels || [['Got it', 1, 'Said it clearly'], ['Partly', 0.5, 'Meaning got across'], ['Not yet', 0, 'Froze or missed']];
  return `<div class="selfrow" data-self="1">${labels.map(([l, v, s]) => `<button class="btn" data-v="${v}"><span>${l}</span><span class="tiny muted">${s}</span></button>`).join('')}</div><p class="tiny muted" style="margin-top:6px">Self-rated: the app can't hear you, so this is your judgement.</p>`;
}
function bindSelf(cb) { const rows = $$('[data-self]:not([data-bound])'); const r = rows[rows.length - 1]; if (!r) return; r.dataset.bound = '1'; r.onclick = ev => { const b = ev.target.closest('button'); if (!b) return; $$('button', r).forEach(x => x.disabled = true); b.classList.add('primary'); cb(+b.dataset.v); }; }
function confRow() { return `<div class="conf" data-confrow="1"><span class="small muted">Confidence:</span>${[1, 2, 3, 4, 5].map(n => `<button data-c="${n}" aria-label="Confidence ${n} of 5">${n}</button>`).join('')}</div>`; }
function bindConf(itemId) { const rows = $$('[data-confrow]:not([data-bound])'); const r = rows[rows.length - 1]; if (!r) return; r.dataset.bound = '1'; r.onclick = ev => { const b = ev.target.closest('button'); if (!b) return; $$('button', r).forEach(x => x.classList.toggle('on', x === b)); S.conf.push({ t: now(), id: itemId, c: +b.dataset.c }); save(); }; }

/* Evaluation panel for typed production. strict = short form (conjugation, vocab). */
function showEval(ctx, input, acc, opts) {
  opts = opts || {};
  const lang = opts.lang || 'ko';
  const ev = evaluate(input, acc, lang);
  const kind = opts.kind || 'produce';
  const altList = acc.slice(1, 4).map(a => `<li>${esc(a)}</li>`).join('');
  const modelBlock = `<div class="model ${lang}">${esc(acc[0])}</div>${lang === 'ko' ? romKo(acc[0]) : ''}${altList ? `<div class="small muted">Also accepted:</div><ul class="alts">${altList}</ul>` : ''}`;
  const note = opts.note ? `<p class="small" style="margin-top:8px">${opts.note}</p>` : '';
  if (ev.status === 'match') {
    ctx.add(`<div class="fb ok"><div class="h">✓ Recognised answer</div>${modelBlock}${note}</div>`);
    return ctx.finish({ score: 1, kind, hint: opts.hint });
  }
  if (ev.status === 'empty') { toast('Type an answer, or use "Show answer".'); $$('#ex .ans').forEach(x => x.disabled = false); return false; }
  if (opts.strict) {
    const d = diffHtml(input, ev.best);
    ctx.add(`<div class="fb err"><div class="h">Not the expected form</div><div class="small">Yours: <span class="ko">${d.user}</span></div><div class="small">Expected: <span class="ko">${d.model}</span></div>${note}
      <button class="btn small ghost" id="overrule" style="margin-top:8px">Mine was valid too</button></div>`);
    $('#overrule').onclick = () => { $('#overrule').disabled = true; $('#overrule').textContent = 'Counted as self-assessed'; RUN.res[RUN.res.length - 1].score = 1; RUN.res[RUN.res.length - 1].self = true; itemRec(ctx.e.id).box = Math.max(itemRec(ctx.e.id).box, 1); save(); };
    return ctx.finish({ score: 0, kind, hint: opts.hint });
  }
  const marker = opts.concept ? conceptMarker(opts.concept, input) : null;
  const c = DB.conceptById[opts.concept];
  const markerLine = marker === null || !c ? '' : `<div class="small" style="margin:6px 0">${marker ? '<span class="pill-ok">✓</span>' : '<span class="pill-warn">?</span>'} Target pattern <b>${esc(c.t.split('—')[0].trim())}</b> ${marker ? 'detected' : 'not detected'} in your answer.</div>`;
  if (ev.status === 'near') {
    const d = diffHtml(input, ev.best);
    ctx.add(`<div class="fb warn"><div class="h">Very close: compare the differences</div><div class="small">Yours: <span class="${lang}">${d.user}</span></div><div class="small">Closest model: <span class="${lang}">${d.model}</span></div>${markerLine}${note}${selfRow(null, [['Same meaning', 1, 'Just a typo'], ['Partly', 0.5, 'Small error'], ['Not quite', 0, 'Real mistake']])}</div>`);
  } else {
    ctx.add(`<div class="fb info"><div class="h">Not in my answer bank — that doesn't make it wrong</div><div class="small">This offline app can only match against stored answers. Compare yours with the model and judge the meaning.</div>${markerLine}<div class="small" style="margin-top:6px">Model answer:</div>${modelBlock}${note}${selfRow(null, [['Same meaning', 1, 'Natural & correct'], ['Partly', 0.5, 'Meaning OK, form off'], ['Different', 0, 'I missed it']])}</div>`);
  }
  bindSelf(v => ctx.finish({ score: v, self: true, kind, hint: opts.hint }));
  footBtns([]);
  return true;
}

/* Memory match */
EX.match = (ctx, _, x) => {
  const items = x.ids.map(id => DB.items[id]).filter(Boolean);
  const isJa = x.pool === 'jp';
  const L = shuffle(items.map(i => ({ id: i.id, t: isJa ? i.jp : i.ko }))), R = shuffle(items.map(i => ({ id: i.id, t: i.en })));
  let sel = null, wrong = 0, done = 0;
  ctx.set(`<div class="ex-type">Memory match</div><p class="small muted">Tap a ${isJa ? 'Japanese phrase' : 'Korean word'}, then its meaning.</p>
    <div class="match" id="m"><div class="list">${L.map(l => `<button data-side="L" data-id="${l.id}" class="${isJa ? 'ja' : 'ko'}">${esc(l.t)}</button>`).join('')}</div>
    <div class="list">${R.map(r => `<button data-side="R" data-id="${r.id}" class="small">${esc(r.t)}</button>`).join('')}</div></div>`);
  $('#m').onclick = ev => {
    const b = ev.target.closest('button'); if (!b || b.classList.contains('ok')) return;
    if (!sel || sel.dataset.side === b.dataset.side) { $$('#m button.sel').forEach(z => z.classList.remove('sel')); sel = b; b.classList.add('sel'); return; }
    if (sel.dataset.id === b.dataset.id) { sel.classList.remove('sel'); sel.classList.add('ok'); b.classList.add('ok'); sel.disabled = b.disabled = true; done++; items.forEach(i => { if (i.id === b.dataset.id) recordItem(i.id, { score: 1, kind: 'recog' }); }); }
    else { wrong++; b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 350); recordItem(b.dataset.id, { score: 0.4, kind: 'recog' }); }
    sel = null;
    if (done === items.length) { ctx.add(`<div class="fb ok"><div class="h">All matched${wrong ? ` · ${wrong} mismatch${wrong > 1 ? 'es' : ''}` : ''}</div><div class="small muted">Matching is recognition. Typed recall counts more towards mastery.</div></div>`); ctx.finish({ score: items.length / (items.length + wrong), kind: 'recog', noRecord: true }); }
  };
  footBtns([['Skip', () => ctx.finish({ score: 0.5, kind: 'recog', noRecord: true }), 'ghost']]);
};

/* Translation challenge: English → Korean sentence */
EX.translate = (ctx, it) => {
  const c = DB.conceptById[it.c]; const d = ctx.diff; let hinted = false;
  const showParen = d === 'easy' || d === 'medium';
  const en = showParen ? it.en : stripHints(it.en);
  ctx.set(`<div class="ex-type">Translate ${srcLabel(it)} ${d !== 'expert' ? conceptChip(it.c) : ''} ${timerHtml()}</div>
    <div class="prompt">${esc(en)}</div>
    ${d === 'easy' && c ? `<div class="hint"><b>${esc(c.t)}</b><br>${esc(c.rules[0] || '')}</div>` : ''}
    <div id="hintbox"></div>
    <textarea class="ans ko" id="a" lang="ko" placeholder="Say it aloud first, then type it" aria-label="Korean translation"></textarea>`);
  startTimer();
  const chk = () => { const v = $('#a').value; if (!v.trim()) { toast('Type your answer, or tap "I said it aloud".'); return; } $('#a').disabled = true; clearTimer(); showEval(ctx, v, it.acc, { concept: it.c, kind: 'produce', hint: hinted, note: c ? `<b>${esc(c.t)}</b>: ${esc(c.ex)}` : '' }); };
  const spoke = () => { clearTimer(); $('#a').disabled = true; ctx.add(`<div class="fb"><div class="h">Model answer</div><div class="model ko">${esc(it.acc[0])}</div>${romKo(it.acc[0])}${it.acc.length > 1 ? `<ul class="alts">${it.acc.slice(1, 4).map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : ''}${selfRow()}</div>`); footBtns([]); bindSelf(v => ctx.finish({ score: v, self: true, kind: 'speak', hint: hinted })); };
  const hint = () => { hinted = true; const first = it.acc[0].split(' ')[0]; $('#hintbox').innerHTML = `<div class="hint">${c ? `Pattern: <b>${esc(c.t)}</b><br>` : ''}${hintParen(it.en).length && !showParen ? `Words: ${esc(hintParen(it.en).join(', '))}<br>` : ''}Starts with: <span class="ko">${esc(first)} …</span></div>`; };
  const btns = [['I said it aloud', spoke, 'ghost']];
  if (d !== 'expert') btns.unshift(['Hint', hint, 'ghost small']);
  btns.push(['Check', chk, 'primary']);
  footBtns(btns);
};
/* Sentence scramble: tap tokens into order */
EX.scramble = (ctx, it) => {
  const target = it.acc[0].trim().split(/\s+/);
  let toks = shuffle(target.map((t, i) => ({ t, i })));
  if (ctx.diff === 'hard' || ctx.diff === 'expert') { const decoys = { '을': '를', '를': '을', '이': '가', '가': '이', '는': '은', '은': '는' }; const cand = target.find(t => decoys[t.slice(-1)]); if (cand) toks.push({ t: cand.slice(0, -1) + decoys[cand.slice(-1)], i: -1 }); toks = shuffle(toks); }
  const chosen = [];
  ctx.set(`<div class="ex-type">Sentence scramble ${srcLabel(it)} ${conceptChip(it.c)}</div><div class="prompt">${esc(stripHints(it.en))}</div>
    <div class="tokline" id="line" aria-live="polite"></div><div class="tokens" id="pool"></div>
    ${toks.some(t => t.i < 0) ? '<p class="tiny muted">One tile is a decoy with the wrong particle.</p>' : ''}`);
  const draw = () => {
    $('#line').innerHTML = chosen.length ? chosen.map((k, j) => `<button class="tok" data-j="${j}">${esc(toks[k].t)}</button>`).join('') : '<span class="small muted">Tap the tiles in order</span>';
    $('#pool').innerHTML = toks.map((t, k) => `<button class="tok ${chosen.includes(k) ? 'used' : ''}" data-k="${k}" ${chosen.includes(k) ? 'disabled' : ''}>${esc(t.t)}</button>`).join('');
  };
  draw();
  $('#pool').onclick = ev => { const b = ev.target.closest('button[data-k]'); if (!b) return; chosen.push(+b.dataset.k); draw(); };
  $('#line').onclick = ev => { const b = ev.target.closest('button[data-j]'); if (!b) return; chosen.splice(+b.dataset.j, 1); draw(); };
  const chk = () => {
    const s = chosen.map(k => toks[k].t).join(' ');
    if (chosen.length < target.length) { toast('Use all the tiles (except a decoy).'); return; }
    $('#pool').onclick = $('#line').onclick = null;
    const ok = it.acc.some(a => canonKo(a) === canonKo(s));
    if (ok) { ctx.add(`<div class="fb ok"><div class="h">✓ Correct order</div><div class="model ko">${esc(s)}</div></div>`); ctx.finish({ score: 1, kind: 'construct' }); }
    else { const d = diffHtml(s, it.acc[0]); ctx.add(`<div class="fb err"><div class="h">Not quite</div><div class="small">Yours: <span class="ko">${d.user}</span></div><div class="small">Model: <span class="ko">${d.model}</span></div><p class="small">Korean order: time/place → object → verb last. ${esc((DB.conceptById[it.c] || {}).ex || '')}</p></div>`); ctx.finish({ score: 0.2, kind: 'construct' }); }
  };
  footBtns([['Clear', () => { chosen.length = 0; draw(); }, 'ghost'], ['Check', chk, 'primary']]);
};

function highestLevel() { let l = 1; for (let i = 1; i <= 6; i++) if (S.unlocked[i]) l = i; return l; }
function questRemaining() { return questActs().filter(a => !S.quest.done[a.id] && !S.quest.skipped[a.id]).reduce((s, a) => s + a.min, 0); }

VIEWS.inventory = () => {
  const poolNames = { tr: 'Translations', qa: 'Q&A', cj: 'Form drills', fb: 'Fill-ins', mk: 'Mistakes', nc: 'Natural choice', ps: 'Politeness' };

  return `<button class="btn small ghost" data-go="#ko">‹ Korean</button><h1 style="margin-top:10px">Curriculum inventory</h1>

  <div class="sect"><h2>Corrections made to source items</h2></div>
  <ul class="small"><li>LK2-5 translations skip item 8; numbering is not reused here.</li><li>LK2-7 #25: "quiet warm" read as "quite warm".</li><li>LK2-9 "I made many friends while I am here" rewritten as "while living here" (면서 needs the same subject and a sensible time frame).</li><li>LK2-9 #17 "While I was reading… I heard the phone" has different subjects, so 면서 is replaced with 때 / 동안 and flagged in the exercise.</li><li>LK2-7 #28 "father was a soldier": 았/었어서 isn't grammatical, so the model uses 군인이셔서 / 군인이라서.</li></ul>

VIEWS.progress.after = () => { const f = $('#impFile'); if (f) f.onchange = e => { const file = e.target.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => doImport(r.result); r.readAsText(file); }; };
function exportData() { return JSON.stringify({ app: 'travel-language-academy', exported: new Date().toISOString(), state: S }, null, 1); }
function doImport(text) {
  try {
    let t = text.trim(); if (!t.startsWith('{')) t = decodeURIComponent(escape(atob(t)));
    const d = JSON.parse(t); const st = d.state || d;
    if (!st || typeof st !== 'object' || !st.items || !st.settings) throw new Error('This doesn\'t look like a progress backup.');
    if (!confirm(`Replace progress on this device with the backup (${Object.keys(st.items).length} items)?`)) return;
    S = mergeState(DEFAULT_STATE(), st); save(true); applySettings(); toast('Backup imported.'); route();
  } catch (e) { alert('Import failed: ' + e.message); }
}
